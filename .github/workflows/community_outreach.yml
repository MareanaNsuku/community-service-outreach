name: Community Outreach

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install O365 pandas openpyxl python-dotenv msal requests beautifulsoup4 xlsxwriter

      - name: Run outreach
        env:
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          MSAL_REFRESH_TOKEN: ${{ secrets.MSAL_REFRESH_TOKEN }}
        run: |
          bash auto_send_all.sh
