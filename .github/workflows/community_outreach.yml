name: Community Outreach

on:
  schedule:
    # Daily at 06:00 UTC = 08:00 SAST
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      location:
        description: 'Select location'
        required: true
        default: 'Cape Town'
        type: choice
        options:
          - Cape Town
          - Johannesburg
          - Randburg
          - Sandton
          - Centurion
          - Roodepoort
          - Midrand
          - Rosebank
          - Alberton
          - Edenvale
          - Soweto
          - Boksburg
          - Kempton Park
          - Krugersdorp
          - Daveyton
          - Springs
      category:
        description: 'Select category (or All)'
        required: true
        default: 'All Categories'
        type: choice
        options:
          - All Categories
          - Sports & Recreation
          - Animal Welfare
          - Environmental
          - Arts & Culture
          - Youth & Tutoring
          - Health & Wellness
          - Senior Care
          - Community Development
          - Women & Family Support
          - Emergency & Rescue

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install O365 pandas openpyxl python-dotenv msal requests beautifulsoup4 xlsxwriter

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "location=Cape Town" >> $GITHUB_OUTPUT
            echo "category=All Categories" >> $GITHUB_OUTPUT
          else
            echo "location=${{ github.event.inputs.location }}" >> $GITHUB_OUTPUT
            echo "category=${{ github.event.inputs.category }}" >> $GITHUB_OUTPUT
          fi

      - name: Run outreach
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ steps.mode.outputs.category }}" = "All Categories" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 12 ]; then
              SLOT="morning"
            else
              SLOT="evening"
            fi
            echo "UTC hour: $HOUR → using slot: $SLOT"
            bash send_all_categories.sh "${{ steps.mode.outputs.location }}" "$SLOT"
          else
            bash send_subset.sh "${{ steps.mode.outputs.location }}" "${{ steps.mode.outputs.category }}"
          fi

      - name: Commit results back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/*.xlsx || true
          git commit -m "Auto: $(date -u +%Y-%m-%d) scrape results" || echo "No changes"
          git pull --rebase origin main || true
          git push || (sleep 5 && git pull --rebase origin main && git push) || echo "Push failed"
