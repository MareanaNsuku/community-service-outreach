name: Community Outreach

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Select location'
        required: true
        default: 'Cape Town'
        type: choice
        options:
          - Cape Town
          - Randburg
          - Sandton
          - Johannesburg
          - Centurion
          - Roodepoort
          - Midrand
          - Rosebank
          - Alberton
          - Edenvale
          - Soweto
          - Boksburg
          - Kempton Park
          - Krugersdorp
          - Daveyton
          - Springs
      category:
        description: 'Select category (or All)'
        required: true
        default: 'All Categories'
        type: choice
        options:
          - All Categories
          - Sports & Recreation
          - Animal Welfare
          - Environmental
          - Arts & Culture
          - Youth & Tutoring
          - Health & Wellness
          - Senior Care
          - Community Development
          - Women & Family Support
          - Emergency & Rescue

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl xlsxwriter

      - name: Run outreach
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.category }}" = "All Categories" ]; then
            bash send_all_categories.sh "${{ github.event.inputs.location }}"
          else
            bash send_subset.sh "${{ github.event.inputs.location }}" "${{ github.event.inputs.category }}"
          fi

      - name: Commit results back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/*.xlsx || true
          git commit -m "Auto: update sent log $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase origin main || true
          git push || echo "Push failed"
