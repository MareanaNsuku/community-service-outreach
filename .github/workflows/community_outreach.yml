name: Community Outreach

on:
  schedule:
    - cron: '5 7 * * 1-5'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install O365 pandas openpyxl python-dotenv msal requests beautifulsoup4 xlsxwriter playwright
          playwright install --with-deps chromium

      - name: Prepare token from secret
        env:
          MSAL_TOKEN_CACHE: ${{ secrets.MSAL_TOKEN_CACHE }}
        run: |
          mkdir -p o365_token
          echo "$MSAL_TOKEN_CACHE" > o365_token/o365_token.txt

      - name: Run outreach
        env:
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
        run: |
          ./auto_send_all.sh
