name: Community Outreach

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Select location'
        required: true
        default: 'Cape Town'
        type: choice
        options:
          - Cape Town
          - Randburg
          - Sandton
          - Johannesburg
          - Centurion
          - Roodepoort
          - Midrand
          - Rosebank
          - Alberton
          - Edenvale
          - Soweto
          - Boksburg
          - Kempton Park
          - Krugersdorp
          - Daveyton
          - Springs
      category:
        description: 'Select category (or All)'
        required: true
        default: 'All Categories'
        type: choice
        options:
          - All Categories
          - Sports & Recreation
          - Animal Welfare
          - Environmental
          - Arts & Culture
          - Youth & Tutoring

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install O365 pandas openpyxl python-dotenv msal requests beautifulsoup4 xlsxwriter ddgs

      - name: Run all categories (or single)
        env:
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          MSAL_REFRESH_TOKEN: ${{ secrets.MSAL_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.category }}" = "All Categories" ]; then
            bash send_all_categories.sh "${{ github.event.inputs.location }}"
          else
            bash send_subset.sh "${{ github.event.inputs.location }}" "${{ github.event.inputs.category }}"
          fi

      - name: Commit results back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/*.xlsx || true
          git commit -m "Auto: update scraped results and sent log" || echo "No changes to commit"
          git push || echo "Push failed"
