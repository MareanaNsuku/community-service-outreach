name: Community Outreach

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Select category (or All)'
        required: true
        default: 'All Categories'
        type: choice
        options:
          - All Categories
          - Sports & Recreation
          - Animal Welfare
          - Environmental
          - Arts & Culture
          - Youth & Tutoring
          - Community Development
          - Museums & Heritage
          - Emergency & Rescue
          - Women & Family Support
          - Senior Care
          - Health & Wellness
          - Libraries & Reading Programmes
          - Public Parks & Gardens
          - Cultural Centres & Community Halls
          - Historic Sites & Preservation
          - Neighbourhood Associations
          - Community Media & Radio
          - Community Markets & Farmers Markets
          - Performing Arts & Music Groups
          - Adult Education & Skills Training
          - Volunteer Centres & NGO Support
          - Tourism & Visitor Information
          - Community Events & Festivals
          - Hobby & Special Interest Clubs
  schedule:
    - cron: '0 4,12 * * *'

permissions:
  contents: write

concurrency:
  group: community-outreach-${{ github.ref }}
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl xlsxwriter requests beautifulsoup4

      - name: Scan bounces
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          echo "=== STEP 1: Scanning for bounces ==="
          python3 bounce_handler.py || echo "Bounce scan failed, continuing anyway"

      - name: Commit bounce results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/blocklist.xlsx || true
          git commit -m "Bounce scan $(date -u +%Y-%m-%d)" || echo "No bounce changes"

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "category=All Categories" >> $GITHUB_OUTPUT
          else
            echo "category=${{ github.event.inputs.category }}" >> $GITHUB_OUTPUT
          fi

      - name: Run outreach
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_PASSWORD: ${{ secrets.BREVO_SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          if [ "${{ steps.mode.outputs.category }}" = "All Categories" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 9 ]; then
              SLOT="morning"
            else
              SLOT="evening"
            fi
            echo "UTC hour: $HOUR → using slot: $SLOT"
            bash send_all_categories.sh "$SLOT"
          else
            bash send_subset.sh "Cape Town" "${{ steps.mode.outputs.category }}"
          fi
      - name: Sync batch results back to master
        if: always()
        run: python3 sync_batch_to_master.py

      - name: Commit send results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/*.xlsx results/*.csv || true
          git commit -m "Auto: update sent log $(date -u +%Y-%m-%d)" || echo "No changes"

          # Fetch remote and merge — for binary files, take OURS (we have the newest data)
          git config pull.rebase false
          git pull --no-rebase --no-edit -X ours origin main || git pull --no-rebase --no-edit origin main || echo "Pull had conflicts, continuing"

          git push origin main || echo "Push failed"
