name: Community Outreach

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Select location'
        required: true
        default: 'Cape Town'
        type: choice
        options:
          - Cape Town
          - Randburg
          - Sandton
          - Johannesburg
          - Centurion
          - Roodepoort
          - Midrand
          - Rosebank
          - Alberton
          - Edenvale
          - Soweto
          - Boksburg
          - Kempton Park
          - Krugersdorp
          - Daveyton
          - Springs
      category:
        description: 'Select category'
        required: true
        default: 'Sports & Recreation'
        type: choice
        options:
          - Sports & Recreation
          - Animal Welfare
          - Environmental
          - Arts & Culture
          - Youth & Tutoring

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install O365 pandas openpyxl python-dotenv msal requests beautifulsoup4 xlsxwriter

      - name: Run outreach for selected location/category
        env:
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          MSAL_REFRESH_TOKEN: ${{ secrets.MSAL_REFRESH_TOKEN }}
        run: |
          bash send_subset.sh "${{ github.event.inputs.location }}" "${{ github.event.inputs.category }}"

      - name: Commit results back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/*.xlsx || true
          git commit -m "Auto: update scraped results and sent log" || echo "No changes to commit"
          git push || echo "Push skipped"
